[project]
name = "community-swap-agent"
version = "0.1.0"
description = "Community second-hand swap intelligent agent platform backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pymysql>=1.1.1",
  # SSL 连接（Aiven 等托管 MySQL 强制 TLS）与 caching_sha2_password 认证的必需依赖
  "cryptography>=43.0.0",
  "dbutils>=3.1.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyjwt>=2.9.0",
  "python-multipart>=0.0.9",
  "email-validator>=2.2.0",
  "requests>=2.31.0",
  "openai>=3.28.0",
  "pillow>=12.3.0",
  "mcp>=2.3.0",
]

[tool.uv]
dev-dependencies= [
  "pytest>=8.0.0",
]
